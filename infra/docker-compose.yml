services:
  b2b:
    build:
      context: ../services/b2b
    environment:
      DATABASE_URL: sqlite:////data/neomarket.db
      B2C_SERVICE_KEY: dev-service-key
      B2C_URL: http://b2c:8000
      B2B_SERVICE_KEY: dev-service-key
      JWT_SECRET: dev-secret
      MODERATION_SERVICE_KEY: dev-service-key
      MODERATION_URL: http://moderation:8000
    ports:
      - "8000:8000"
    volumes:
      - b2b-data:/data
  b2c:
    build:
      context: ../services/b2c
    environment:
      B2B_URL: http://b2b:8000
      B2B_SERVICE_KEY: dev-service-key
      DATABASE_URL: sqlite:////data/neomarket-b2c.db
      JWT_SECRET: dev-secret
    ports:
      - "8001:8000"
    volumes:
      - b2c-data:/data
    depends_on:
      - b2b
  moderation:
    build:
      context: ../services/moderation
    environment:
      B2B_TO_MODERATION_SERVICE_KEY: dev-service-key
      CLAIM_TTL_MINUTES: "30"
      DATABASE_URL: sqlite:////data/neomarket-moderation.db
      JWT_SECRET: dev-secret
    ports:
      - "8002:8000"
    volumes:
      - moderation-data:/data

volumes:
  b2b-data:
  b2c-data:
  moderation-data:
